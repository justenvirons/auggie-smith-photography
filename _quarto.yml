project:
  type: website
  output-dir: _site
  resources:
    - cms/images/
  render:
    - "*.qmd"
    - "!server-setup-guide.qmd"

website:
  title: "Auggie Smith Photography"
  site-url: "http://www.auggie-smith-photography.com"
  navbar:
    background: dark
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: portfolio.qmd
        text: Portfolio
      - href: about.qmd
        text: About
      - href: contact.qmd
        text: Contact
    right:
      - icon: instagram
        href: "https://www.instagram.com/auggie_smithphotography"
        aria-label: Instagram
  page-footer:
    background: dark
    center: "© 2026 Auggie Smith Photography &nbsp;·&nbsp; All Rights Reserved"

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    theme: darkly
    css: styles.css
    toc: false
    lightbox: true
